name: Architecture Review

on:
  workflow_dispatch:
    inputs:
      publish_issues:
        description: "Publicar findings como issues?"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    environment: architecture-reviewer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ARCH_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.ARCH_REVIEWER_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openai requests

      - name: Run Architecture Reviewer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PUBLISH_ISSUES: ${{ inputs.publish_issues }}
        run: python scripts/architecture_review.py
