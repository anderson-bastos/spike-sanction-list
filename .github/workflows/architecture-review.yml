name: Architecture Review

# Dispara a revisão de arquitetura em cada Pull Request. O job usa o GitHub
# Environment "architecture-reviewer" (criado em Settings -> Environments), de
# onde vêm as credenciais/secrets que o agente precisa (ver passo 1 do seu guia).
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Permissões mínimas para o agente comentar o PR e, se desejado, abrir issues.
# Ajuste conforme o que o seu agente realmente faz.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Acessa as credenciais do Environment "architecture-reviewer".
    environment: architecture-reviewer
    steps:
      - name: Checkout (histórico completo p/ diff do PR)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar a arquitetura (fitness functions do próprio repo)
        # Guarda objetiva e determinística: o ArchUnit (HexagonalArchitectureTest)
        # e o teste de contrato OpenAPI já falham o build se a regra de dependência
        # ou o contrato forem violados. Isto roda SEM depender de IA.
        run: ./gradlew test --tests "com.spike.ofac.architecture.*"

