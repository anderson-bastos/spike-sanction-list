# Kotlin incremental compilation caches per-source-set classpath snapshots under
# build/. Combined with the openapi-generator sources on the main source set and a
# `clean` that wipes build/ (sometimes while the IDE's own Gradle/Kotlin daemon is
# touching the tree), the incremental path can race and make compileTestKotlin fail
# with "unresolved main types". A full (non-incremental) compile is deterministic
# and the build is small, so disable Kotlin incremental compilation for reliability.
kotlin.incremental=false

# Run the Kotlin compiler in-process rather than via a shared, long-lived daemon,
# so a stale daemon classpath view cannot leak across clean builds.
kotlin.compiler.execution.strategy=in-process
