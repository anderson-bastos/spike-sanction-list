spring:
  application:
    name: ofac-sanctions-ingestion
  # Local PostgreSQL Data_Store (processed Internal_Model + version metadata + pointers).
  # The schema (task 13.1) must create indexes for the Query_API name search:
  #   - a case-insensitive CONTAINS index over primary_name and alias values
  #     (e.g. a trigram / GIN index), and
  #   - an index enabling deterministic FixedRef ordering for pagination.
  datasource:
    url: jdbc:postgresql://localhost:5432/ofac
    username: ofac
    password: ofac

ofac:
  # Local Raw_Snapshot_Store: each raw snapshot is written to a file here under a
  # name derived from (Publish_Date, Digest). Never stored in the Data_Store (Req 15.8).
  raw-snapshot-store:
    folder: ./data/raw-snapshot-store

# The Scheduler polls per Source_List on a configurable, bounded, sub-daily
# interval (Spring @Scheduled; no OS cron). Bound to SchedulerProperties and
# validated at startup to sit within [1m .. 1d]. Default is 6h (sub-daily).
  scheduler:
    interval: 6h

# API-first (spec-first): the curated src/main/resources/static/openapi.yaml is the
# source of truth and is what Swagger UI serves. springdoc's own generation from the
# code is disabled — the code adheres to the contract at COMPILE time (QueryController
# implements the interface generated from this same file). See docs/api-reference.md.
springdoc:
  # Keep api-docs ENABLED so springdoc registers the Swagger UI resources and the
  # /v3/api-docs/swagger-config the UI needs to initialize (disabling it 404s the UI).
  # The UI is pointed at the curated static contract via swagger-ui.url, so it loads
  # the source-of-truth openapi.yaml rather than a doc generated from the code.
  api-docs:
    enabled: true           # keeps Swagger UI resources + /v3/api-docs/swagger-config available
  swagger-ui:
    enabled: true
    url: /openapi.yaml      # Swagger UI loads the static, curated contract (source of truth)
    path: /swagger-ui.html
